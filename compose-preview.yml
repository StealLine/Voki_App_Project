        condition: service_completed_successfully

  general-voki-taking-service:
    image: ${CI_REGISTRY_IMAGE}/general-voki-taking:${TAG_BAKCEND}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__GeneralVokiTakingServiceDb: "Host=postgres;Port=5432;User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=vokimi_voki_taking_general_service_db;SslMode=Disable"
      MessageBroker__Host: rabbitmq
      MessageBroker__Username: ${RABBITMQ_USER}
      MessageBroker__Password: ${RABBITMQ_PASSWORD}
      MessageBroker__RetryCount: "3"

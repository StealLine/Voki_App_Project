      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-seeder:
        condition: service_completed_successfully

  vokimi-storage-service:
    image: ${CI_REGISTRY_IMAGE}/storage:${TAG_BAKCEND}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ServiceName: StorageService
      FrontendUrl: ${FRONTEND_URL}
      FfmpegPath: /usr/bin
      JwtTokenConfig__Issuer: vokimi_auth_service
      JwtTokenConfig__UserIdClaimKey: user_id_claim
      JwtTokenConfig__Audience: vokimi_frontend_app
      JwtTokenConfig__PublicKey: "${JWT_PUBLIC_KEY}"
      S3__AccessKey: ${S3_ACCESS_KEY}
      S3__SecretKey: ${S3_SECRET_KEY}
      S3__ServiceURL: ${S3_SERVICE_URL}
      S3__MainBucket__Name: vokimi-storage
    networks:
      - ${NETWORK_NAME}
    depends_on:
      rabbitmq:
        condition: service_healthy


  # ── Frontend + Nginx ────────────────────────────────────────────────────────

  frontend:
    image: ${CI_REGISTRY_IMAGE}/frontend:${TAG_FRONTEND}
    networks:
      - ${NETWORK_NAME}
    environment:
      NODE_ENV: production

  nginx:
    image: ${CI_REGISTRY_IMAGE}/nginx:${TAG_FRONTEND}
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.${CI_COMMIT_SHORT_SHA}.rule=Host(`${CI_COMMIT_SHORT_SHA}.vokimi-test.ru`)"
    - "traefik.http.services.${CI_COMMIT_SHORT_SHA}.loadbalancer.server.port=80"
    - "traefik.http.middlewares.${CI_COMMIT_SHORT_SHA}-auth.basicauth.users=${PREVIEW_PASS_HASH}"
    - "traefik.http.routers.${CI_COMMIT_SHORT_SHA}.middlewares=${CI_COMMIT_SHORT_SHA}-auth"
    - "traefik.http.routers.${CI_COMMIT_SHORT_SHA}.tls.certresolver=le"
    - "traefik.http.routers.${CI_COMMIT_SHORT_SHA}.tls=true"
    - "traefik.http.routers.${CI_COMMIT_SHORT_SHA}.entrypoints=websecure"

    networks:
      - ${NETWORK_NAME}
      - preview_deploy
    depends_on:
      - frontend
      - auth-service
      - albums-service
      - tags-service
      - user-profiles-service
      - voki-comments-service
      - voki-ratings-service
      - vokis-catalog-service
      - core-voki-creation-service
      - general-voki-creation-service
      - general-voki-taking-service
      - vokimi-storage-service

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  ${NETWORK_NAME}:
  preview_deploy:
    external: true
  voki-ratings-service:
    image: ${CI_REGISTRY_IMAGE}/voki-ratings:${TAG_BAKCEND}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__VokiRatingsServiceDb: "Host=postgres;Port=5432;User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=vokimi_voki_ratings_service_db;SslMode=Disable"
      MessageBroker__Host: rabbitmq
      MessageBroker__Username: ${RABBITMQ_USER}
      MessageBroker__Password: ${RABBITMQ_PASSWORD}
      MessageBroker__RetryCount: "3"
      MessageBroker__RetryIntervalSeconds: "5"
      ServiceName: VokiRatingsService
      FrontendUrl: ${FRONTEND_URL}
      JwtTokenConfig__Issuer: vokimi_auth_service
      JwtTokenConfig__UserIdClaimKey: user_id_claim
      JwtTokenConfig__Audience: vokimi_frontend_app
      JwtTokenConfig__PublicKey: "${JWT_PUBLIC_KEY}"
    networks:
      - ${NETWORK_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-seeder:
        condition: service_completed_successfully

  vokis-catalog-service:
    image: ${CI_REGISTRY_IMAGE}/vokis-catalog:${TAG_BAKCEND}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__VokisCatalogServiceDb: "Host=postgres;Port=5432;User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=vokimi_vokis_catalog_service_db;SslMode=Disable"
      MessageBroker__Host: rabbitmq
      MessageBroker__Username: ${RABBITMQ_USER}
      MessageBroker__Password: ${RABBITMQ_PASSWORD}

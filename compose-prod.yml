  # ── Frontend + Nginx ────────────────────────────────────────────────────────


  frontend:
    image: ${CI_REGISTRY_IMAGE}/frontend:${TAG_FRONTEND}
    networks:
      - ${NETWORK_NAME}
    environment:
      NODE_ENV: production


  nginx:
    image: ${CI_REGISTRY_IMAGE}/nginx:${TAG_NGINX}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vokimi.rule=Host(`vokimi-test.ru`)"
      - "traefik.http.services.vokimi.loadbalancer.server.port=8080"
      - "traefik.http.routers.vokimi.tls.certresolver=le"
      - "traefik.http.routers.vokimi.tls=true"
      - "traefik.http.routers.vokimi.entrypoints=websecure"
      - "traefik.docker.network=${DEPLOY_NETWORK_NAME}"
    networks:
      - ${NETWORK_NAME}
      - ${DEPLOY_NETWORK_NAME}
    depends_on:
      - frontend
      - auth-service
      - albums-service
      - tags-service
      - user-profiles-service
      - voki-comments-service
      - voki-ratings-service
      - vokis-catalog-service
      - core-voki-creation-service
      - general-voki-creation-service
      - general-voki-taking-service
      - vokimi-storage-service


volumes:
  postgres_data:
    external: true
  rabbitmq_data:
    external: true


networks:
  ${NETWORK_NAME}:
    external: true
  ${DEPLOY_NETWORK_NAME}:
    external: true

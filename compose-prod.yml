  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ${NETWORK_NAME}






  # ── DB Seeder ────────────────────────────────────────────────────────────────


  db-seeder:
    image: ${CI_REGISTRY_IMAGE}/db-seeder:${TAG_DB_SEEDER}
    environment:
      ConnectionStrings__AuthServiceDb: "Host=postgres;Port=5432;User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=vokimi_auth_service_db;SslMode=Disable"
      ConnectionStrings__TagsServiceDb: "Host=postgres;Port=5432;User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=vokimi_tags_service_db;SslMode=Disable"
      ConnectionStrings__UserProfilesServiceDb: "Host=postgres;Port=5432;User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=vokimi_user_profiles_service_db;SslMode=Disable"
      ConnectionStrings__CoreVokiCreationServiceDb: "Host=postgres;Port=5432;User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=vokimi_voki_creation_core_service_db;SslMode=Disable"
      ConnectionStrings__GeneralVokiCreationServiceDb: "Host=postgres;Port=5432;User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=vokimi_voki_creation_general_service_db;SslMode=Disable"
      ConnectionStrings__VokisCatalogServiceDb: "Host=postgres;Port=5432;User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=vokimi_vokis_catalog_service_db;SslMode=Disable"
      ConnectionStrings__GeneralVokiTakingServiceDb: "Host=postgres;Port=5432;User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=vokimi_voki_taking_general_service_db;SslMode=Disable"
      ConnectionStrings__VokiRatingsServiceDb: "Host=postgres;Port=5432;User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=vokimi_voki_ratings_service_db;SslMode=Disable"
      ConnectionStrings__VokiCommentsServiceDb: "Host=postgres;Port=5432;User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=vokimi_voki_comments_service_db;SslMode=Disable"
      ConnectionStrings__AlbumsServiceDb: "Host=postgres;Port=5432;User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=vokimi_albums_service_db;SslMode=Disable"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["clear"]
    restart: "no"
    networks:
      - ${NETWORK_NAME}


  # ── Backend Services ────────────────────────────────────────────────────────


  auth-service:
    image: ${CI_REGISTRY_IMAGE}/auth:${TAG_AUTH}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__AuthServiceDb: "Host=postgres;Port=5432;User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Database=vokimi_auth_service_db;SslMode=Disable"
      MessageBroker__Host: rabbitmq
      MessageBroker__Username: ${RABBITMQ_USER}
      MessageBroker__Password: ${RABBITMQ_PASSWORD}
      MessageBroker__RetryCount: "3"
      MessageBroker__RetryIntervalSeconds: "5"
      ServiceName: AuthService
      FrontendUrl: ${FRONTEND_URL}
      FrontendConfig__BaseUrl: ${FRONTEND_URL}
      FrontendConfig__ConfirmRegistrationPath: confirm-registration
      JwtTokenConfig__Issuer: vokimi_auth_service
      JwtTokenConfig__UserIdClaimKey: user_id_claim
      JwtTokenConfig__Audience: vokimi_frontend_app
      JwtTokenConfig__PublicKey: "${JWT_PUBLIC_KEY}"
      AuthPrivateKey__PrivateKey: "${JWT_PRIVATE_KEY}"
      EmailServiceConfig__Host: ${EMAIL_HOST}
      EmailServiceConfig__Port: ${EMAIL_PORT}
      EmailServiceConfig__Username: ${EMAIL_USERNAME}
      EmailServiceConfig__Password: ${EMAIL_PASSWORD}
    networks:
      - ${NETWORK_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-seeder:
        condition: service_completed_successfully


  albums-service:
